<div class="select" [class.is-open]="open()" [class.is-disabled]="isDisabled()">
  <button
    #trigger
    class="select-trigger"
    type="button"
    aria-haspopup="listbox"
    [attr.aria-expanded]="open()"
    [disabled]="isDisabled()"
    (click)="toggle()"
    (keydown)="onTriggerKeydown($event)"
  >
    <span class="select-value" [class.is-placeholder]="!selected()">
      {{ selected()?.label ?? placeholder() }}
    </span>
    <svg
      class="select-chevron"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="m6 9 6 6 6-6" />
    </svg>
  </button>

  @if (open()) {
  <div class="select-panel">
    <label class="select-search">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <circle cx="11" cy="11" r="6.5" />
        <path d="m16 16 4 4" />
      </svg>
      <input
        #search
        type="text"
        autocomplete="off"
        [value]="query()"
        [placeholder]="searchPlaceholder()"
        [attr.aria-label]="searchPlaceholder()"
        (input)="onSearchInput($event)"
        (keydown)="onSearchKeydown($event)"
      />
    </label>

    <ul class="select-list" role="listbox">
      @for (option of filtered(); track option.value; let index = $index) {
      <li role="none">
        <button
          class="select-option"
          type="button"
          role="option"
          [class.is-selected]="option.value === value()"
          [class.is-highlighted]="isHighlighted(index)"
          [attr.aria-selected]="option.value === value()"
          (click)="choose(option)"
          (mouseenter)="highlight.set(index)"
        >
          <span class="select-option-label">{{ option.label }}</span>
          @if (option.hint) {
          <span class="select-option-hint">{{ option.hint }}</span>
          } @if (option.value === value()) {
          <svg
            class="select-check"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m5 13 4 4L19 7" />
          </svg>
          }
        </button>
      </li>
      } @empty {
      <li class="select-empty">{{ emptyText() }}</li>
      }
    </ul>
  </div>
  }
</div>
